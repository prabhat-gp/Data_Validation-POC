name: CI

# The 60-second "did I break the build" check. It deliberately does NOT stand
# up a database: the real proof is extra/after_pull.py (compiles every rule)
# and extra/test_violation_query.py (checks every generated query against what
# the engine recorded), both of which need real data. Run those locally.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r backend/requirements.txt
      - name: Python compiles
        run: python -m compileall -q backend/app extra

      - name: No unused imports or dead names
        run: |
          pip install -q pyflakes
          python -m pyflakes backend/app backend/app/routers extra

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: TypeScript typechecks
        working-directory: frontend
        run: npx tsc --noEmit

      # backend/.env and the PP Telegraf files are tracked ON PURPOSE -- see
      # .gitignore. What must never land is customer data.
      - name: No customer data committed
        run: |
          if git ls-files | grep -E '^(data_dump|final_dump)/'; then
            echo "::error::source data is tracked -- both folders are gitignored"
            exit 1
          fi
          if git ls-files | grep -E '\.(csv|xlsx)$'; then
            echo "::error::a data file is tracked"
            exit 1
          fi
          echo "clean"
