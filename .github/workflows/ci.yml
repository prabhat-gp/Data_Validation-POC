name: CI

# Runs on both branches. No MySQL, no PR needed -- this is the 60-second
# "did I break the build" check. The real proof (test_violation_query.py)
# needs a database, so run that locally before merging test -> main.
on:
  push:
    branches: [main, test]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r backend/requirements.txt
      - name: Python compiles
        working-directory: backend
        run: python -m compileall -q app *.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: TypeScript typechecks
        working-directory: frontend
        run: npx tsc --noEmit

      - name: No credentials or real data committed
        run: |
          bad=0
          git ls-files | grep -E '(^|/)\.env$'            && { echo "::error::.env is tracked"; bad=1; }
          git ls-files | grep -E '^data_dump/|\.csv$'     && { echo "::error::data files tracked"; bad=1; }
          git ls-files | grep -E '\.(woff2?|otf|ttf)$'    && { echo "::error::font binaries tracked"; bad=1; }
          exit $bad
